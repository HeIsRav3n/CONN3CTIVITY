    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100;0,200;0,300;0,400;0,600;0,700;1,300&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
    <title>CONN3CTIVITY — Search • Find • Conn3ct</title>
  </head>
  <body>
    <audio
      id="welcome-audio"
      src="/welcome-conn3ctivity.mp3"
      preload="auto"
      autoplay
      playsinline
      webkit-playsinline
    ></audio>
    <script>
      // Kick welcome audio as early as possible (before React mounts)
      (function () {
        var a = document.getElementById('welcome-audio')
        if (!a) return
        a.volume = 0.9
        try {
          if (localStorage.getItem('conn3ctivity_sound_muted') === '1') {
            a.muted = true
            return
          }
        } catch (e) {}
        var tryPlay = function () {
          var p = a.play()
          if (p && p.catch) p.catch(function () {})
        }
        tryPlay()
        a.addEventListener('canplaythrough', tryPlay, { once: true })
        setTimeout(tryPlay, 100)
        setTimeout(tryPlay, 500)
        setTimeout(tryPlay, 1500)
      })()
    </script>
    <div id="root">
      <!-- Skeleton shown before React mounts — hides itself once root is populated -->
      <div id="app-loading" style="position:fixed;inset:0;background:#0B0A08;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px">
        <div style="font-family:'Josefin Sans',sans-serif;letter-spacing:0.3em;font-size:13px;color:#C9A96E;text-transform:uppercase">CONN3CTIVITY</div>
        <div style="width:40px;height:1px;background:linear-gradient(90deg,transparent,#C9A96E,transparent);animation:shimmer 1.4s infinite">
          <style>@keyframes shimmer{0%,100%{opacity:0.3}50%{opacity:1}}</style>
        </div>
      </div>
    </div>
    <script>
      var __errCount = 0
      window.onerror = function(msg, src, line, col, err) {
        // Ignore canvas/animation errors (non-finite, requestAnimationFrame noise) and extension conflicts
        if (msg && (msg.indexOf('non-finite') !== -1 || msg.indexOf('ethereum') !== -1 || msg.indexOf('CanvasRenderingContext2D') !== -1)) return true
        __errCount++
        if (__errCount > 1) return true // only show the first fatal error
        var el = document.getElementById('app-loading')
        if (el) el.remove()
        document.getElementById('root').innerHTML = '<div style="padding:40px;background:#0b0a08;min-height:100vh;color:#C9A96E;font-family:monospace"><h1 style="color:#ef4444;margin-bottom:16px">Runtime Error</h1><pre style="white-space:pre-wrap;color:#EDE8DC;font-size:13px">' + msg + '\n\nFile: ' + src + ':' + line + ':' + col + '\n\n' + (err && err.stack || '') + '</pre></div>'
      }
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason && (e.reason.message || String(e.reason))
        if (msg && (msg.indexOf('non-finite') !== -1 || msg.indexOf('ethereum') !== -1)) return
        if (msg && /supabase|AuthApiError|Failed to fetch|NetworkError|abort/i.test(msg)) return
        __errCount++
        if (__errCount > 1) return
        var el = document.getElementById('app-loading')
        if (el) el.remove()
        document.getElementById('root').innerHTML = '<div style="padding:40px;background:#0b0a08;min-height:100vh;color:#C9A96E;font-family:monospace"><h1 style="color:#ef4444;margin-bottom:16px">Unhandled Promise</h1><pre style="white-space:pre-wrap;color:#EDE8DC;font-size:13px">' + (e.reason && (e.reason.stack || e.reason.message || String(e.reason))) + '</pre></div>'
      })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
